spring.application.name=atlas-platform

spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/atlas}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:atlas}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:atlas}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

server.port=${SERVER_PORT:8080}
server.error.include-message=never
server.error.include-binding-errors=never

management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=when_authorized
management.endpoint.health.probes.enabled=true

springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html

atlas.api.base-path=/api/v1

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=25MB
atlas.uploads.dir=${ATLAS_UPLOADS_DIR:uploads}

# Stripe billing (leave api-key blank for local stub mode)
atlas.billing.stripe.api-key=${STRIPE_API_KEY:}
atlas.billing.stripe.webhook-secret=${STRIPE_WEBHOOK_SECRET:}
atlas.billing.stripe.success-url=${STRIPE_SUCCESS_URL:http://localhost:8080/billing/success}
atlas.billing.stripe.cancel-url=${STRIPE_CANCEL_URL:http://localhost:8080/billing/cancel}
atlas.billing.stripe.team-price-id=${STRIPE_TEAM_PRICE_ID:}
atlas.billing.stripe.business-price-id=${STRIPE_BUSINESS_PRICE_ID:}

logging.level.com.atlas=INFO
logging.level.org.springframework.security=INFO
